---
- name: Provision a Remnawave node
  hosts: all
  become: true
  gather_facts: true

  vars:
    remnanode_dir: /opt/remnanode
    remnanode_image: "{{ lookup('ansible.builtin.env', 'NODE_PROVISIONING_REMNANODE_IMAGE') }}"
    remnanode_port: '{{ node_api_port | default(2222) }}'
    effective_remnanode_secret_key: '{{ remnanode_secret_key | default(node_secret_key | default("")) }}'
    effective_panel_api_cidrs: '{{ panel_api_cidrs | default([panel_api_cidr | default(panel_ip | default(""))]) }}'
    selfsteal_dir: /opt/nginx-selfsteal
    selfsteal_acme_port: 8443
    selfsteal_script_version: 2.10.0
    selfsteal_script_url: https://raw.githubusercontent.com/DigneZzZ/remnawave-scripts/bab40b53e484deb1b01aff615f946dc78640f969/selfsteal.sh
    selfsteal_script_sha256: 3594f3a4ddae19582f9dde95fdf65edeaf2892dec662eadabba55e1f8faff4c4
    selfsteal_script_path: /usr/local/src/selfsteal-2.10.0.sh
    selfsteal_marker_path: /opt/.cabinet-selfsteal-{{ provisioning_job_id }}
    selfsteal_archive_path: /opt/nginx-selfsteal.partial-{{ provisioning_job_id }}-{{ ansible_date_time.epoch }}
    selfsteal_bootstrap_tls_dir: /run/cabinet-selfsteal-{{ provisioning_job_id }}
    selfsteal_certificate_stage_dir: /run/cabinet-selfsteal-cert-{{ provisioning_job_id }}
    acme_script_version: 3.1.4
    acme_script_url: https://github.com/acmesh-official/acme.sh/archive/refs/tags/3.1.4.tar.gz
    acme_script_sha256: e5f8e187bbf5251e0cd8891f2622daab9850366bd17bea9f92c2fe2ee091fd32
    acme_script_archive: /usr/local/src/acme.sh-3.1.4.tar.gz
    acme_script_source: /usr/local/src/acme.sh-3.1.4/acme.sh
    acme_issue_timeout_seconds: 300
    public_tcp_ports:
      - 80
      - 443
      - 10443
    verify_transport_ports: false
    transport_tcp_ports:
      - 443
      - 10443

  pre_tasks:
    - name: Validate the target and required provisioning variables
      ansible.builtin.assert:
        that:
          - ansible_distribution in ['Debian', 'Ubuntu']
          - ansible_kernel is version('5.7', '>=')
          - provisioning_job_id is defined
          - provisioning_job_id is match('^[a-z0-9_-]{8,64}$')
          - node_fqdn is defined
          - node_fqdn is match('^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\\.)+[a-z]{2,63}$')
          - effective_remnanode_secret_key | length >= 32
          - remnanode_image is defined
          - remnanode_image | length > 0
          - effective_panel_api_cidrs | length > 0
          - effective_panel_api_cidrs | select | list | length > 0
          - admin_email is defined
          - admin_email is match('^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$')
          - (remnanode_port | int) >= 1
          - (remnanode_port | int) <= 65535
          - (ansible_port | default(22) | int) >= 1
          - (ansible_port | default(22) | int) <= 65535
        fail_msg: >-
          Provisioning requires Ubuntu/Debian with Linux 5.7+, a lower-case FQDN,
          provisioning_job_id, remnanode_secret_key, panel_api_cidrs and a valid admin_email.
      no_log: true

    - name: Validate the Remnanode image reference
      ansible.builtin.assert:
        that:
          - >-
            remnanode_image is match('^.+@sha256:[a-f0-9]{64}$') or
            remnanode_image is match('^.+:[^/:]+$')
        fail_msg: >-
          Set remnanode_image to an image with an explicit tag or sha256 digest.

  tasks:
    - name: Install base operating-system packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - cron
          - curl
          - dnsutils
          - git
          - gnupg
          - iproute2
          - nftables
          - openssl
          - python3-debian
          - socat
          - ufw
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the APT keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install the Docker repository signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: '0644'
        force: false

    - name: Read the Debian package architecture
      ansible.builtin.command:
        argv:
          - dpkg
          - --print-architecture
      register: docker_deb_architecture
      changed_when: false

    - name: Configure the Docker APT repository
      ansible.builtin.deb822_repository:
        name: docker
        types:
          - deb
        uris:
          - https://download.docker.com/linux/{{ ansible_distribution | lower }}
        suites:
          - '{{ ansible_distribution_release }}'
        components:
          - stable
        architectures:
          - '{{ docker_deb_architecture.stdout }}'
        signed_by: /etc/apt/keyrings/docker.asc
        state: present

    - name: Install Docker Engine and Compose
      ansible.builtin.apt:
        name:
          - containerd.io
          - docker-buildx-plugin
          - docker-ce
          - docker-ce-cli
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Enable Docker and cron
      ansible.builtin.service:
        name: '{{ item }}'
        enabled: true
        state: started
      loop:
        - docker
        - cron

    - name: Create the Remnanode directory
      ansible.builtin.file:
        path: '{{ remnanode_dir }}'
        state: directory
        owner: root
        group: root
        mode: '0750'

    - name: Install the Remnanode environment
      ansible.builtin.template:
        src: templates/remnanode.env.j2
        dest: '{{ remnanode_dir }}/.env'
        owner: root
        group: root
        mode: '0600'
      no_log: true
      register: remnanode_environment

    - name: Install the Remnanode Compose project
      ansible.builtin.template:
        src: templates/remnanode-compose.yml.j2
        dest: '{{ remnanode_dir }}/docker-compose.yml'
        owner: root
        group: root
        mode: '0640'
      register: remnanode_compose

    - name: Validate the Remnanode Compose project
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - '{{ remnanode_dir }}'
          - config
          - --quiet
      changed_when: false
      no_log: true

    - name: Start or reconcile Remnanode
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - '{{ remnanode_dir }}'
          - up
          - -d
          - --pull
          - always
          - --remove-orphans
      register: remnanode_compose_up
      changed_when: >-
        remnanode_environment.changed or remnanode_compose.changed or
        'Created' in remnanode_compose_up.stderr or
        'Recreated' in remnanode_compose_up.stderr or
        'Started' in remnanode_compose_up.stderr
      no_log: true

    - name: Read the initial firewall status
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      register: initial_ufw_status
      changed_when: false

    - name: Set the default UFW policies
      ansible.builtin.command:
        argv:
          - ufw
          - default
          - '{{ item.policy }}'
          - '{{ item.direction }}'
      loop:
        - policy: deny
          direction: incoming
          marker: 'Default: deny (incoming)'
        - policy: allow
          direction: outgoing
          marker: 'allow (outgoing)'
      when: item.marker not in initial_ufw_status.stdout

    - name: Permit public node transport ports
      ansible.builtin.command:
        argv:
          - ufw
          - allow
          - '{{ item }}/tcp'
      loop: '{{ (public_tcp_ports + [selfsteal_acme_port | int]) | unique }}'
      register: ufw_public_rule
      changed_when: "'Rule added' in ufw_public_rule.stdout or 'Rules updated' in ufw_public_rule.stdout"

    - name: Keep SSH publicly reachable on the active Ansible port
      ansible.builtin.command:
        argv:
          - ufw
          - allow
          - '{{ ansible_port | default(22) | string }}/tcp'
      register: ufw_ssh_rule
      changed_when: "'Rule added' in ufw_ssh_rule.stdout or 'Rules updated' in ufw_ssh_rule.stdout"

    - name: Remove outdated Remnanode API firewall rules
      ansible.builtin.shell: |
        set -euo pipefail
        mapfile -t rule_numbers < <(
          ufw status numbered | awk -v port='{{ remnanode_port | string }}' '
            /^\[[[:space:]]*[0-9]+\]/ && $0 ~ ("(^|[[:space:]])" port "/tcp([[:space:]]|$)") && $0 ~ /ALLOW IN/ {
              line = $0
              sub(/^\[[[:space:]]*/, "", line)
              sub(/\].*$/, "", line)
              print line
            }
          ' | sort -rn
        )
        for rule_number in "${rule_numbers[@]}"; do
          ufw --force delete "${rule_number}"
        done
      args:
        executable: /bin/bash
      register: ufw_stale_panel_rules
      changed_when: "'Rule deleted' in ufw_stale_panel_rules.stdout"

    - name: Permit the Remnanode API only from the current panel addresses
      ansible.builtin.command:
        argv:
          - ufw
          - allow
          - from
          - '{{ item }}'
          - to
          - any
          - port
          - '{{ remnanode_port | string }}'
          - proto
          - tcp
      loop: '{{ effective_panel_api_cidrs | select | unique }}'
      register: ufw_panel_rule
      changed_when: "'Rule added' in ufw_panel_rule.stdout or 'Rules updated' in ufw_panel_rule.stdout"

    - name: Enable UFW
      ansible.builtin.command:
        argv:
          - ufw
          - --force
          - enable
      register: ufw_enable
      when: "initial_ufw_status.stdout is not search('Status: active')"

    - name: Create the local source directory
      ansible.builtin.file:
        path: /usr/local/src
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Download the pinned SelfSteal installer
      ansible.builtin.get_url:
        url: '{{ selfsteal_script_url }}'
        dest: '{{ selfsteal_script_path }}'
        checksum: sha256:{{ selfsteal_script_sha256 }}
        owner: root
        group: root
        mode: '0755'

    - name: Download the pinned acme.sh release
      ansible.builtin.get_url:
        url: '{{ acme_script_url }}'
        dest: '{{ acme_script_archive }}'
        checksum: sha256:{{ acme_script_sha256 }}
        owner: root
        group: root
        mode: '0644'

    - name: Read the installed acme.sh version
      ansible.builtin.command:
        argv:
          - /root/.acme.sh/acme.sh
          - --version
      register: installed_acme_version
      changed_when: false
      failed_when: false

    - name: Extract the pinned acme.sh release
      ansible.builtin.unarchive:
        src: '{{ acme_script_archive }}'
        dest: /usr/local/src
        remote_src: true
        creates: '{{ acme_script_source }}'
      when: >-
        installed_acme_version.rc != 0 or
        installed_acme_version.stdout is not search('v' + acme_script_version)

    - name: Install or update acme.sh without modifying shell profiles
      ansible.builtin.command:
        argv:
          - '{{ acme_script_source }}'
          - --install
          - --force
          - --home
          - /root/.acme.sh
          - --config-home
          - /root/.acme.sh
          - --accountemail
          - '{{ admin_email }}'
          - --no-profile
        chdir: /usr/local/src/acme.sh-{{ acme_script_version }}
      when: >-
        installed_acme_version.rc != 0 or
        installed_acme_version.stdout is not search('v' + acme_script_version)

    - name: Validate the pinned acme.sh installation
      ansible.builtin.command:
        argv:
          - /root/.acme.sh/acme.sh
          - --version
      register: validated_acme_version
      changed_when: false

    - name: Require the expected acme.sh release
      ansible.builtin.assert:
        that:
          - validated_acme_version.stdout is search('v' + acme_script_version)
        fail_msg: acme.sh was installed, but its version does not match the pinned release.

    - name: Use Let's Encrypt as the default ACME server
      ansible.builtin.command:
        argv:
          - /root/.acme.sh/acme.sh
          - --set-default-ca
          - --server
          - letsencrypt
      changed_when: false

    - name: Register the administrator ACME account
      ansible.builtin.command:
        argv:
          - /root/.acme.sh/acme.sh
          - --register-account
          - --server
          - letsencrypt
          - --accountemail
          - '{{ admin_email }}'
      changed_when: false

    - name: Keep the administrator email on the ACME account
      ansible.builtin.command:
        argv:
          - /root/.acme.sh/acme.sh
          - --update-account
          - --server
          - letsencrypt
          - --accountemail
          - '{{ admin_email }}'
      changed_when: false

    - name: Check the SelfSteal installation directory
      ansible.builtin.stat:
        path: '{{ selfsteal_dir }}'
      register: selfsteal_directory

    - name: Check the required SelfSteal installation files
      ansible.builtin.stat:
        path: '{{ item }}'
      loop:
        - '{{ selfsteal_dir }}/.env'
        - '{{ selfsteal_dir }}/docker-compose.yml'
        - '{{ selfsteal_dir }}/nginx.conf'
        - '{{ selfsteal_dir }}/conf.d/selfsteal.conf'
        - '{{ selfsteal_dir }}/ssl/fullchain.crt'
        - '{{ selfsteal_dir }}/ssl/private.key'
      register: selfsteal_required_files

    - name: Read the configured SelfSteal domain
      ansible.builtin.shell: >-
        awk -F= '$1 == "SELF_STEAL_DOMAIN" { print $2; exit }'
        {{ (selfsteal_dir + '/.env') | quote }}
      args:
        executable: /bin/bash
      register: selfsteal_configured_domain
      changed_when: false
      failed_when: false

    - name: Validate the existing SelfSteal Compose project
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - '{{ selfsteal_dir }}'
          - config
          - --quiet
      register: existing_selfsteal_compose
      changed_when: false
      failed_when: false

    - name: Validate the existing certificate hostname
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - '{{ selfsteal_dir }}/ssl/fullchain.crt'
          - -noout
          - -checkhost
          - '{{ node_fqdn }}'
      register: existing_selfsteal_certificate_hostname
      changed_when: false
      failed_when: false

    - name: Validate the existing certificate lifetime
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - '{{ selfsteal_dir }}/ssl/fullchain.crt'
          - -noout
          - -checkend
          - '86400'
      register: existing_selfsteal_certificate_lifetime
      changed_when: false
      failed_when: false

    - name: Read the existing certificate subject
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - '{{ selfsteal_dir }}/ssl/fullchain.crt'
          - -noout
          - -subject
          - -nameopt
          - RFC2253
      register: existing_selfsteal_certificate_subject
      changed_when: false
      failed_when: false

    - name: Read the existing certificate issuer
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - '{{ selfsteal_dir }}/ssl/fullchain.crt'
          - -noout
          - -issuer
          - -nameopt
          - RFC2253
      register: existing_selfsteal_certificate_issuer
      changed_when: false
      failed_when: false

    - name: Read the existing certificate public-key fingerprint
      ansible.builtin.shell: >-
        set -o pipefail &&
        openssl x509 -in {{ (selfsteal_dir + '/ssl/fullchain.crt') | quote }} -pubkey -noout |
        openssl pkey -pubin -outform DER |
        sha256sum | cut -d' ' -f1
      args:
        executable: /bin/bash
      register: existing_selfsteal_certificate_public_key
      changed_when: false
      failed_when: false

    - name: Read the existing private-key public-key fingerprint
      ansible.builtin.shell: >-
        set -o pipefail &&
        openssl pkey -in {{ (selfsteal_dir + '/ssl/private.key') | quote }} -pubout -outform DER |
        sha256sum | cut -d' ' -f1
      args:
        executable: /bin/bash
      register: existing_selfsteal_private_key_public_key
      changed_when: false
      failed_when: false
      no_log: true

    - name: Inspect the existing SelfSteal container
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - '{% raw %}{{ index .Config.Labels "com.docker.compose.project.working_dir" }}|{{ index .Config.Labels "com.docker.compose.project.config_files" }}|{{.State.Running}}|{{.State.Restarting}}{% endraw %}'
          - nginx-selfsteal
      register: existing_selfsteal_container
      changed_when: false
      failed_when: false

    - name: List all Docker container names
      ansible.builtin.command:
        argv:
          - docker
          - container
          - ls
          - --all
          - --format
          - '{% raw %}{{.Names}}{% endraw %}'
      register: existing_docker_container_names
      changed_when: false
      failed_when: false

    - name: Verify the domain of the existing SelfSteal container
      ansible.builtin.shell: >-
        set -o pipefail &&
        docker inspect --format
        '{% raw %}{{range .Config.Env}}{{println .}}{{end}}{% endraw %}'
        nginx-selfsteal |
        grep -Fx -- {{ ('SELF_STEAL_DOMAIN=' + node_fqdn) | quote }}
      args:
        executable: /bin/bash
      register: existing_selfsteal_container_domain
      changed_when: false
      failed_when: false
      no_log: true

    - name: Verify the mounts of the existing SelfSteal container
      ansible.builtin.shell: |
        set -o pipefail
        mounts="$(
          docker inspect --format \
          '{% raw %}{{range .Mounts}}{{printf "%s|%s\n" .Source .Destination}}{{end}}{% endraw %}' \
          nginx-selfsteal
        )" &&
        grep -Fx -- {{ (selfsteal_dir + '/nginx.conf|/etc/nginx/nginx.conf') | quote }} <<< "$mounts" &&
        grep -Fx -- {{ (selfsteal_dir + '/conf.d|/etc/nginx/conf.d') | quote }} <<< "$mounts" &&
        grep -Fx -- {{ (selfsteal_dir + '/ssl|/etc/nginx/ssl') | quote }} <<< "$mounts" &&
        grep -Fx -- {{ (selfsteal_dir + '/html|/var/www/html') | quote }} <<< "$mounts"
      args:
        executable: /bin/bash
      register: existing_selfsteal_container_mounts
      changed_when: false
      failed_when: false

    - name: Check the cabinet SelfSteal ownership marker
      ansible.builtin.stat:
        path: '{{ selfsteal_marker_path }}'
      register: selfsteal_marker

    - name: Read the cabinet SelfSteal ownership marker
      ansible.builtin.slurp:
        src: '{{ selfsteal_marker_path }}'
      register: selfsteal_marker_contents
      when: selfsteal_marker.stat.exists
      no_log: true

    - name: Determine the current SelfSteal state
      ansible.builtin.set_fact:
        selfsteal_is_healthy: >-
          {{ selfsteal_required_files.results
             | selectattr('stat.exists', 'equalto', false)
             | list
             | length == 0 and
             selfsteal_configured_domain.rc == 0 and
             selfsteal_configured_domain.stdout | trim == node_fqdn and
             existing_selfsteal_compose.rc | default(1) == 0 and
             existing_selfsteal_certificate_hostname.rc | default(1) == 0 and
             existing_selfsteal_certificate_lifetime.rc | default(1) == 0 and
             existing_selfsteal_certificate_subject.rc | default(1) == 0 and
             existing_selfsteal_certificate_issuer.rc | default(1) == 0 and
             (existing_selfsteal_certificate_subject.stdout | default('') | regex_replace('^subject=', '')) !=
             (existing_selfsteal_certificate_issuer.stdout | default('') | regex_replace('^issuer=', '')) and
             existing_selfsteal_certificate_public_key.rc | default(1) == 0 and
             existing_selfsteal_private_key_public_key.rc | default(1) == 0 and
             existing_selfsteal_certificate_public_key.stdout | default('') | length == 64 and
             existing_selfsteal_certificate_public_key.stdout | default('') ==
             existing_selfsteal_private_key_public_key.stdout | default('') and
             existing_selfsteal_container.rc == 0 and
             existing_selfsteal_container.stdout | trim ==
             selfsteal_dir + '|' + selfsteal_dir + '/docker-compose.yml|true|false' }}
        selfsteal_marker_is_owned: >-
          {{ selfsteal_marker.stat.exists and
             selfsteal_marker_contents.content | default('') | b64decode | trim ==
             provisioning_job_id + ' ' + node_fqdn + ' ' + selfsteal_script_sha256 }}
        selfsteal_container_is_owned: >-
          {{ (existing_selfsteal_container.rc == 0 and
              (existing_selfsteal_container.stdout | trim ==
               selfsteal_dir + '|' + selfsteal_dir + '/docker-compose.yml|true|false' or
               existing_selfsteal_container.stdout | trim ==
               selfsteal_dir + '|' + selfsteal_dir + '/docker-compose.yml|true|true' or
               existing_selfsteal_container.stdout | trim ==
               selfsteal_dir + '|' + selfsteal_dir + '/docker-compose.yml|false|false')) or
             existing_selfsteal_container_mounts.rc == 0 }}
        selfsteal_container_is_absent: >-
          {{ existing_docker_container_names.rc == 0 and
             'nginx-selfsteal' not in
             (existing_docker_container_names.stdout_lines | default([])) }}
        selfsteal_container_domain_matches: >-
          {{ existing_selfsteal_container_domain.rc == 0 }}

    - name: Determine whether an owned SelfSteal bootstrap can be resumed
      ansible.builtin.set_fact:
        selfsteal_is_resumable: >-
          {{ not selfsteal_is_healthy | bool and
             selfsteal_marker_is_owned | bool and
             selfsteal_required_files.results
             | selectattr('stat.exists', 'equalto', false)
             | list
             | length == 0 and
             selfsteal_configured_domain.rc == 0 and
             selfsteal_configured_domain.stdout | trim == node_fqdn and
             existing_selfsteal_compose.rc | default(1) == 0 and
             existing_selfsteal_certificate_hostname.rc | default(1) == 0 and
             existing_selfsteal_certificate_public_key.rc | default(1) == 0 and
             existing_selfsteal_private_key_public_key.rc | default(1) == 0 and
             existing_selfsteal_certificate_public_key.stdout | default('') | length == 64 and
             existing_selfsteal_certificate_public_key.stdout | default('') ==
             existing_selfsteal_private_key_public_key.stdout | default('') and
             (selfsteal_container_is_owned | bool or selfsteal_container_is_absent | bool) }}

    - name: Refuse to replace an unverified SelfSteal installation
      ansible.builtin.assert:
        that:
          - >-
            selfsteal_is_healthy | bool or
            (not selfsteal_directory.stat.exists and
             (selfsteal_container_is_absent | bool or selfsteal_container_is_owned | bool)) or
            (selfsteal_marker_is_owned | bool and
             (selfsteal_container_is_owned | bool or selfsteal_container_is_absent | bool)) or
            ((selfsteal_configured_domain.stdout | trim == node_fqdn or
              selfsteal_container_domain_matches | bool) and
             (selfsteal_container_is_owned | bool or selfsteal_container_is_absent | bool))
        fail_msg: >-
          Existing SelfSteal is unhealthy but cannot be safely attributed to this job.
          It was left untouched; inspect {{ selfsteal_dir }} manually.
          Docker inspect rc={{ existing_selfsteal_container.rc }},
          labels={{ existing_selfsteal_container.stdout | default('') | trim | quote }},
          inspect error={{ existing_selfsteal_container.stderr | default('') | trim | quote }},
          container list rc={{ existing_docker_container_names.rc }},
          expected mounts={{ existing_selfsteal_container_mounts.rc == 0 }},
          configured domain matches={{ selfsteal_configured_domain.stdout | trim == node_fqdn }},
          container domain matches={{ selfsteal_container_domain_matches | bool }}.

    - name: Remove the attributed incomplete SelfSteal container before recovery
      ansible.builtin.command:
        argv:
          - docker
          - rm
          - --force
          - nginx-selfsteal
      when:
        - not selfsteal_is_healthy | bool
        - not selfsteal_is_resumable | bool
        - selfsteal_container_is_owned | bool

    - name: Archive an incomplete SelfSteal installation
      ansible.builtin.command:
        argv:
          - mv
          - '{{ selfsteal_dir }}'
          - '{{ selfsteal_archive_path }}'
      when:
        - not selfsteal_is_healthy | bool
        - not selfsteal_is_resumable | bool
        - selfsteal_directory.stat.exists

    - name: Protect the archived SelfSteal files
      ansible.builtin.file:
        path: '{{ selfsteal_archive_path }}'
        owner: root
        group: root
        mode: u=rwX,go=
        recurse: true
      when:
        - not selfsteal_is_healthy | bool
        - not selfsteal_is_resumable | bool
        - selfsteal_directory.stat.exists

    - name: Mark the SelfSteal installation as owned by this job
      ansible.builtin.copy:
        content: |
          {{ provisioning_job_id }} {{ node_fqdn }} {{ selfsteal_script_sha256 }}
        dest: '{{ selfsteal_marker_path }}'
        owner: root
        group: root
        mode: '0600'
      when:
        - not selfsteal_is_healthy | bool
        - not selfsteal_is_resumable | bool

    - name: Create the temporary SelfSteal TLS directory
      ansible.builtin.file:
        path: '{{ selfsteal_bootstrap_tls_dir }}'
        state: directory
        owner: root
        group: root
        mode: '0700'
      when:
        - not selfsteal_is_healthy | bool
        - not selfsteal_is_resumable | bool

    - name: Create a temporary certificate for the SelfSteal bootstrap
      ansible.builtin.command:
        argv:
          - openssl
          - req
          - -x509
          - -newkey
          - rsa:2048
          - -sha256
          - -nodes
          - -days
          - '1'
          - -subj
          - /CN={{ node_fqdn }}
          - -addext
          - subjectAltName=DNS:{{ node_fqdn }}
          - -keyout
          - '{{ selfsteal_bootstrap_tls_dir }}/private.key'
          - -out
          - '{{ selfsteal_bootstrap_tls_dir }}/fullchain.crt'
      no_log: true
      when:
        - not selfsteal_is_healthy | bool
        - not selfsteal_is_resumable | bool

    - name: Install SelfSteal through its official force mode
      ansible.builtin.command:
        argv:
          - '{{ selfsteal_script_path }}'
          - --nginx
          - --socket
          - --force
          - --domain
          - '{{ node_fqdn }}'
          - --template
          - '1'
          - --ssl-cert
          - '{{ selfsteal_bootstrap_tls_dir }}/fullchain.crt'
          - --ssl-key
          - '{{ selfsteal_bootstrap_tls_dir }}/private.key'
          - install
        stdin: "y\n"
        stdin_add_newline: false
      environment:
        DEBIAN_FRONTEND: noninteractive
        TERM: xterm
      when:
        - not selfsteal_is_healthy | bool
        - not selfsteal_is_resumable | bool
      register: selfsteal_install

    - name: Keep the local SelfSteal management command pinned
      ansible.builtin.copy:
        src: '{{ selfsteal_script_path }}'
        dest: /usr/local/bin/selfsteal
        remote_src: true
        owner: root
        group: root
        mode: '0755'

    - name: Install a fail-safe SelfSteal certificate renewal wrapper
      ansible.builtin.template:
        src: templates/acme-renew.sh.j2
        dest: '{{ selfsteal_dir }}/acme-renew.sh'
        owner: root
        group: root
        mode: '0700'
      register: selfsteal_renewal_wrapper

    - name: Remove the upstream raw SelfSteal renewal entry
      ansible.builtin.shell: >-
        set -o pipefail;
        current="$(crontab -l 2>/dev/null || true)";
        filtered="$(printf '%s\n' "$current" |
        grep -vF '{{ selfsteal_dir }}/acme-renew.sh' |
        grep -vE '/root/\\.acme\\.sh/acme\\.sh[[:space:]]+--cron([[:space:]]|$)' || true)";
        if [ "$current" != "$filtered" ]; then
          printf '%s\n' "$filtered" | crontab -;
          echo changed;
        fi
      args:
        executable: /bin/bash
      register: removed_upstream_selfsteal_cron
      changed_when: removed_upstream_selfsteal_cron.stdout is search('changed')

    - name: Schedule the fail-safe SelfSteal certificate renewal
      ansible.builtin.copy:
        content: |
          SHELL=/bin/bash
          PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          0 0 * * * root {{ selfsteal_dir }}/acme-renew.sh
        dest: /etc/cron.d/selfsteal-acme-renew
        owner: root
        group: root
        mode: '0644'

    - name: Validate the SelfSteal Compose project
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - '{{ selfsteal_dir }}'
          - config
          - --quiet
      changed_when: false

    - name: Stop an owned unstable SelfSteal container before recovery
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - '{{ selfsteal_dir }}'
          - down
          - --remove-orphans
      changed_when: true
      when: selfsteal_is_resumable | bool

    - name: Remove the stale SelfSteal Unix socket before recovery
      ansible.builtin.file:
        path: /dev/shm/nginx.sock
        state: absent
      when: selfsteal_is_resumable | bool

    - name: Start or reconcile SelfSteal
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - '{{ selfsteal_dir }}'
          - up
          - -d
          - --remove-orphans
      register: selfsteal_compose_up
      changed_when: >-
        selfsteal_install.changed | default(false) or
        selfsteal_is_resumable | bool or
        'Created' in selfsteal_compose_up.stderr or
        'Recreated' in selfsteal_compose_up.stderr or
        'Started' in selfsteal_compose_up.stderr

    - name: Wait for SelfSteal to remain stable
      ansible.builtin.shell: |
        stable_checks=0
        last_state='unknown'
        for attempt in $(seq 1 30); do
          last_state="$(docker inspect --format \
            '{% raw %}status={{.State.Status}} running={{.State.Running}} restarting={{.State.Restarting}} restarts={{.RestartCount}}{% endraw %}' \
            nginx-selfsteal 2>&1 || true)"
          if [[ "$last_state" == *'status=running running=true restarting=false'* ]]; then
            stable_checks=$((stable_checks + 1))
            if [ "$stable_checks" -ge 3 ]; then
              exit 0
            fi
          else
            stable_checks=0
          fi
          sleep 2
        done
        echo "SelfSteal did not remain stable: $last_state" >&2
        docker logs --tail 100 nginx-selfsteal >&2 || true
        exit 1
      args:
        executable: /bin/bash
      changed_when: false

    - name: Wait for the node API and SelfSteal HTTP listener
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: '{{ item }}'
        state: started
        connect_timeout: 3
        timeout: 120
      loop:
        - '{{ remnanode_port }}'
        - 80

    - name: Wait for the SelfSteal Unix socket
      ansible.builtin.wait_for:
        path: /dev/shm/nginx.sock
        state: present
        timeout: 120

    - name: Wait for provisioned transport listeners
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: '{{ item }}'
        state: started
        connect_timeout: 3
        timeout: 120
      loop: '{{ transport_tcp_ports }}'
      when: verify_transport_ports | bool

    - name: Validate the Nginx configuration inside SelfSteal
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - nginx-selfsteal
          - nginx
          - -t
      changed_when: false

    - name: Validate a cached trusted SelfSteal certificate
      ansible.builtin.shell: >-
        set -o pipefail &&
        test -f {{ ('/root/.acme.sh/' + node_fqdn + '_ecc/fullchain.cer') | quote }} &&
        test -f {{ ('/root/.acme.sh/' + node_fqdn + '_ecc/' + node_fqdn + '.key') | quote }} &&
        test -r {{ ('/root/.acme.sh/' + node_fqdn + '_ecc/' + node_fqdn + '.conf') | quote }} &&
        grep -Eq {{ ("^Le_Domain='" + node_fqdn + "'$") | quote }}
        {{ ('/root/.acme.sh/' + node_fqdn + '_ecc/' + node_fqdn + '.conf') | quote }} &&
        (grep -Eq {{ ("^Le_Webroot='" + selfsteal_dir + "/html'$") | quote }}
        {{ ('/root/.acme.sh/' + node_fqdn + '_ecc/' + node_fqdn + '.conf') | quote }} ||
        (grep -Eq "^Le_Webroot='?(alpn|tls_alpn)'?$"
        {{ ('/root/.acme.sh/' + node_fqdn + '_ecc/' + node_fqdn + '.conf') | quote }} &&
        grep -Eq "^Le_TLSPort='?443'?$"
        {{ ('/root/.acme.sh/' + node_fqdn + '_ecc/' + node_fqdn + '.conf') | quote }})) &&
        openssl x509
        -in {{ ('/root/.acme.sh/' + node_fqdn + '_ecc/fullchain.cer') | quote }}
        -noout -checkhost {{ node_fqdn | quote }} -checkend 86400 &&
        test "$(openssl x509
        -in {{ ('/root/.acme.sh/' + node_fqdn + '_ecc/fullchain.cer') | quote }}
        -pubkey -noout | openssl pkey -pubin -outform DER | sha256sum | cut -d' ' -f1)" =
        "$(openssl pkey
        -in {{ ('/root/.acme.sh/' + node_fqdn + '_ecc/' + node_fqdn + '.key') | quote }}
        -pubout -outform DER | sha256sum | cut -d' ' -f1)"
      args:
        executable: /bin/bash
      register: cached_selfsteal_certificate
      changed_when: false
      failed_when: false
      when: not selfsteal_is_healthy | bool

    - name: Determine whether the trusted certificate needs deployment
      ansible.builtin.set_fact:
        selfsteal_certificate_needs_deployment: >-
          {{ existing_selfsteal_certificate_hostname.rc | default(1) != 0 or
             existing_selfsteal_certificate_lifetime.rc | default(1) != 0 or
             existing_selfsteal_certificate_subject.rc | default(1) != 0 or
             existing_selfsteal_certificate_issuer.rc | default(1) != 0 or
             (existing_selfsteal_certificate_subject.stdout | default('') | regex_replace('^subject=', '')) ==
             (existing_selfsteal_certificate_issuer.stdout | default('') | regex_replace('^issuer=', '')) or
             existing_selfsteal_certificate_public_key.rc | default(1) != 0 or
             existing_selfsteal_private_key_public_key.rc | default(1) != 0 or
             existing_selfsteal_certificate_public_key.stdout | default('') | length != 64 or
             existing_selfsteal_certificate_public_key.stdout | default('') !=
             existing_selfsteal_private_key_public_key.stdout | default('') }}

    - name: Issue the trusted SelfSteal certificate directly on port 443
      when:
        - not selfsteal_is_healthy | bool
        - cached_selfsteal_certificate.rc != 0
      block:
        - name: Stop Remnanode while the direct ACME listener owns port 443
          ansible.builtin.command:
            argv:
              - docker
              - stop
              - remnanode
          changed_when: true

        - name: Wait until port 443 is available for the direct ACME listener
          ansible.builtin.wait_for:
            host: '{{ ansible_default_ipv4.address }}'
            port: 443
            state: stopped
            timeout: 60

        - name: Remove legacy SelfSteal ACME redirect rules
          ansible.builtin.shell: |
            changed=false
            while iptables -t nat -C PREROUTING -p tcp --dport 443 -j REDIRECT --to-port {{ selfsteal_acme_port }} 2>/dev/null; do
              iptables -t nat -D PREROUTING -p tcp --dport 443 -j REDIRECT --to-port {{ selfsteal_acme_port }}
              changed=true
            done
            while iptables -t nat -C OUTPUT -p tcp --dport 443 -o lo -j REDIRECT --to-port {{ selfsteal_acme_port }} 2>/dev/null; do
              iptables -t nat -D OUTPUT -p tcp --dport 443 -o lo -j REDIRECT --to-port {{ selfsteal_acme_port }}
              changed=true
            done
            echo "$changed"
          args:
            executable: /bin/bash
          register: removed_legacy_selfsteal_redirects
          changed_when: removed_legacy_selfsteal_redirects.stdout | trim == 'true'

        - name: Request the trusted SelfSteal certificate through direct TLS-ALPN
          ansible.builtin.command:
            argv:
              - timeout
              - --signal=TERM
              - --kill-after=10s
              - '{{ acme_issue_timeout_seconds | string }}'
              - /root/.acme.sh/acme.sh
              - --issue
              - --alpn
              - --domain
              - '{{ node_fqdn }}'
              - --keylength
              - ec-256
              - --tlsport
              - '443'
              - --server
              - letsencrypt
              - --force
              - --debug
              - '1'
          register: selfsteal_direct_certificate_issue
          changed_when: true
          failed_when: false
      always:
        - name: Start Remnanode after the direct ACME attempt
          ansible.builtin.command:
            argv:
              - docker
              - start
              - remnanode
          register: remnanode_start_after_acme
          changed_when: remnanode_start_after_acme.stdout | trim == 'remnanode'

    - name: Create the fallback HTTP-01 webroot preflight directory
      ansible.builtin.file:
        path: '{{ selfsteal_dir }}/html/.well-known/acme-challenge'
        state: directory
        owner: root
        group: root
        mode: '0755'
      when:
        - not selfsteal_is_healthy | bool
        - cached_selfsteal_certificate.rc != 0
        - selfsteal_direct_certificate_issue.rc | default(1) != 0

    - name: Install the fallback HTTP-01 webroot preflight token
      ansible.builtin.copy:
        content: '{{ provisioning_job_id }}'
        dest: '{{ selfsteal_dir }}/html/.well-known/acme-challenge/cabinet-preflight'
        owner: root
        group: root
        mode: '0644'
      when:
        - not selfsteal_is_healthy | bool
        - cached_selfsteal_certificate.rc != 0
        - selfsteal_direct_certificate_issue.rc | default(1) != 0

    - name: Verify the fallback HTTP-01 route through Nginx
      ansible.builtin.uri:
        url: http://127.0.0.1/.well-known/acme-challenge/cabinet-preflight
        headers:
          Host: '{{ node_fqdn }}'
        return_content: true
        status_code: 200
        timeout: 10
        use_proxy: false
      register: selfsteal_http01_preflight
      changed_when: false
      failed_when: false
      when:
        - not selfsteal_is_healthy | bool
        - cached_selfsteal_certificate.rc != 0
        - selfsteal_direct_certificate_issue.rc | default(1) != 0

    - name: Verify the fallback HTTP-01 route from the provisioning worker
      ansible.builtin.uri:
        url: http://{{ node_fqdn }}/.well-known/acme-challenge/cabinet-preflight
        return_content: true
        status_code: 200
        timeout: 15
        use_proxy: false
      delegate_to: localhost
      become: false
      register: public_selfsteal_http01_preflight
      changed_when: false
      failed_when: false
      when:
        - not selfsteal_is_healthy | bool
        - cached_selfsteal_certificate.rc != 0
        - selfsteal_direct_certificate_issue.rc | default(1) != 0

    - name: Collect SelfSteal HTTP diagnostics
      ansible.builtin.shell: |
        set -o pipefail
        ss -ltnp '( sport = :80 )' 2>&1 || true
        docker inspect --format \
          '{% raw %}state={{.State.Status}} running={{.State.Running}} restarts={{.RestartCount}} error={{.State.Error}}{% endraw %}' \
          nginx-selfsteal 2>&1 || true
        docker logs --tail 80 nginx-selfsteal 2>&1 || true
      args:
        executable: /bin/bash
      register: selfsteal_http_diagnostics
      changed_when: false
      failed_when: false
      when:
        - not selfsteal_is_healthy | bool
        - cached_selfsteal_certificate.rc != 0
        - selfsteal_direct_certificate_issue.rc | default(1) != 0
        - >-
          selfsteal_http01_preflight.status | default(0) != 200 or
          selfsteal_http01_preflight.content | default('') != provisioning_job_id or
          public_selfsteal_http01_preflight.status | default(0) != 200 or
          public_selfsteal_http01_preflight.content | default('') != provisioning_job_id

    - name: Issue the trusted SelfSteal certificate through the fallback HTTP webroot
      ansible.builtin.command:
        argv:
          - timeout
          - --signal=TERM
          - --kill-after=10s
          - '{{ acme_issue_timeout_seconds | string }}'
          - /root/.acme.sh/acme.sh
          - --issue
          - --domain
          - '{{ node_fqdn }}'
          - --webroot
          - '{{ selfsteal_dir }}/html'
          - --keylength
          - ec-256
          - --server
          - letsencrypt
          - --force
          - --debug
          - '1'
      register: selfsteal_webroot_certificate_issue
      changed_when: true
      failed_when: false
      when:
        - not selfsteal_is_healthy | bool
        - cached_selfsteal_certificate.rc != 0
        - selfsteal_direct_certificate_issue.rc | default(1) != 0
        - selfsteal_http01_preflight.status | default(0) == 200
        - selfsteal_http01_preflight.content | default('') == provisioning_job_id
        - public_selfsteal_http01_preflight.status | default(0) == 200
        - public_selfsteal_http01_preflight.content | default('') == provisioning_job_id

    - name: Remove the fallback HTTP-01 webroot preflight token
      ansible.builtin.file:
        path: '{{ selfsteal_dir }}/html/.well-known/acme-challenge/cabinet-preflight'
        state: absent
      when:
        - not selfsteal_is_healthy | bool
        - cached_selfsteal_certificate.rc != 0
        - selfsteal_direct_certificate_issue.rc | default(1) != 0

    - name: Stop when both trusted certificate challenges failed
      ansible.builtin.fail:
        msg: >-
          Could not issue a trusted certificate for {{ node_fqdn }} through direct
          TLS-ALPN on port 443 or the fallback HTTP-01 webroot.
          Local HTTP preflight: status={{ selfsteal_http01_preflight.status | default(0) }},
          error={{ selfsteal_http01_preflight.msg | default('none') }}.
          Public HTTP preflight: status={{ public_selfsteal_http01_preflight.status | default(0) }},
          error={{ public_selfsteal_http01_preflight.msg | default('none') }}.
          Direct TLS result: {{ ((selfsteal_direct_certificate_issue.stdout | default('')) + '\n' +
          (selfsteal_direct_certificate_issue.stderr | default('')))[-2200:] }}
          HTTP result: {{ ((selfsteal_webroot_certificate_issue.stdout | default('')) + '\n' +
          (selfsteal_webroot_certificate_issue.stderr | default('')))[-2200:] }}
          HTTP diagnostics: {{ (selfsteal_http_diagnostics.stdout | default('not collected'))[-2200:] }}
      when:
        - not selfsteal_is_healthy | bool
        - cached_selfsteal_certificate.rc != 0
        - selfsteal_direct_certificate_issue.rc | default(1) != 0
        - selfsteal_webroot_certificate_issue.rc | default(1) != 0

    - name: Deploy the trusted SelfSteal certificate from a validated staging area
      when: selfsteal_certificate_needs_deployment | bool
      block:
        - name: Create the trusted certificate staging directory
          ansible.builtin.file:
            path: '{{ selfsteal_certificate_stage_dir }}'
            state: directory
            owner: root
            group: root
            mode: '0700'

        - name: Stage the trusted certificate without reloading Nginx
          ansible.builtin.command:
            argv:
              - /root/.acme.sh/acme.sh
              - --install-cert
              - --domain
              - '{{ node_fqdn }}'
              - --ecc
              - --key-file
              - '{{ selfsteal_certificate_stage_dir }}/private.key'
              - --fullchain-file
              - '{{ selfsteal_certificate_stage_dir }}/fullchain.crt'
              - --reloadcmd
              - /bin/true
          changed_when: true
          no_log: true

        - name: Validate the staged certificate and private key
          ansible.builtin.shell: >-
            set -o pipefail &&
            openssl x509 -in {{ (selfsteal_certificate_stage_dir + '/fullchain.crt') | quote }}
            -noout -checkhost {{ node_fqdn | quote }} -checkend 86400 &&
            test "$(openssl x509
            -in {{ (selfsteal_certificate_stage_dir + '/fullchain.crt') | quote }}
            -pubkey -noout | openssl pkey -pubin -outform DER | sha256sum | cut -d' ' -f1)" =
            "$(openssl pkey
            -in {{ (selfsteal_certificate_stage_dir + '/private.key') | quote }}
            -pubout -outform DER | sha256sum | cut -d' ' -f1)" &&
            test "$(openssl x509
            -in {{ (selfsteal_certificate_stage_dir + '/fullchain.crt') | quote }}
            -noout -subject -nameopt RFC2253 | sed 's/^subject=//')" !=
            "$(openssl x509
            -in {{ (selfsteal_certificate_stage_dir + '/fullchain.crt') | quote }}
            -noout -issuer -nameopt RFC2253 | sed 's/^issuer=//')"
          args:
            executable: /bin/bash
          changed_when: false
          no_log: true

        - name: Prepare the SelfSteal certificate pair for atomic deployment
          ansible.builtin.shell: |
            set -euo pipefail
            live_dir={{ (selfsteal_dir + '/ssl') | quote }}
            live_key="$live_dir/private.key"
            live_cert="$live_dir/fullchain.crt"
            staged_key={{ (selfsteal_certificate_stage_dir + '/private.key') | quote }}
            staged_cert={{ (selfsteal_certificate_stage_dir + '/fullchain.crt') | quote }}
            pending_key="$live_dir/.cabinet-{{ provisioning_job_id }}-private.key.pending"
            pending_cert="$live_dir/.cabinet-{{ provisioning_job_id }}-fullchain.crt.pending"
            previous_key="$live_dir/.cabinet-{{ provisioning_job_id }}-private.key.previous"
            previous_cert="$live_dir/.cabinet-{{ provisioning_job_id }}-fullchain.crt.previous"

            test -d "$live_dir" || {
              echo "SelfSteal SSL directory is missing: $live_dir" >&2
              exit 1
            }
            test -r "$live_key" || {
              echo "Existing SelfSteal private key is not readable: $live_key" >&2
              exit 1
            }
            test -r "$live_cert" || {
              echo "Existing SelfSteal certificate is not readable: $live_cert" >&2
              exit 1
            }
            rm -f -- "$pending_key" "$pending_cert" "$previous_key" "$previous_cert"
            install -o root -g root -m 0600 "$staged_key" "$pending_key"
            install -o root -g root -m 0644 "$staged_cert" "$pending_cert"
            install -o root -g root -m 0600 "$live_key" "$previous_key"
            install -o root -g root -m 0644 "$live_cert" "$previous_cert"
            pending_certificate_key_fingerprint="$(openssl x509 -in "$pending_cert" -pubkey -noout |
              openssl pkey -pubin -outform DER | sha256sum | cut -d' ' -f1)"
            pending_private_key_fingerprint="$(openssl pkey -in "$pending_key" -pubout -outform DER |
              sha256sum | cut -d' ' -f1)"
            if [[ "$pending_certificate_key_fingerprint" != "$pending_private_key_fingerprint" ]]; then
              echo "Prepared SelfSteal certificate and private key do not match" >&2
              exit 1
            fi
          args:
            executable: /bin/bash
          changed_when: true

        - name: Stop SelfSteal before replacing the certificate pair
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --project-directory
              - '{{ selfsteal_dir }}'
              - down
              - --remove-orphans
          changed_when: true

        - name: Remove the stale SelfSteal Unix socket before certificate deployment
          ansible.builtin.file:
            path: /dev/shm/nginx.sock
            state: absent

        - name: Install the staged SelfSteal certificate pair transactionally
          ansible.builtin.shell: |
            set -euo pipefail
            live_dir={{ (selfsteal_dir + '/ssl') | quote }}
            live_key="$live_dir/private.key"
            live_cert="$live_dir/fullchain.crt"
            pending_key="$live_dir/.cabinet-{{ provisioning_job_id }}-private.key.pending"
            pending_cert="$live_dir/.cabinet-{{ provisioning_job_id }}-fullchain.crt.pending"
            previous_key="$live_dir/.cabinet-{{ provisioning_job_id }}-private.key.previous"
            previous_cert="$live_dir/.cabinet-{{ provisioning_job_id }}-fullchain.crt.previous"

            restore_previous_pair() {
              echo "Certificate deployment failed; restoring the previous SelfSteal pair" >&2
              if [ -f "$previous_key" ] && ! mv -fT -- "$previous_key" "$live_key"; then
                echo "Could not restore the previous SelfSteal private key" >&2
              fi
              if [ -f "$previous_cert" ] && ! mv -fT -- "$previous_cert" "$live_cert"; then
                echo "Could not restore the previous SelfSteal certificate" >&2
              fi
            }
            cleanup_pending_pair() {
              rm -f -- "$pending_key" "$pending_cert"
            }
            trap 'rc=$?; if [ "$rc" -ne 0 ]; then restore_previous_pair; fi; cleanup_pending_pair; exit "$rc"' EXIT
            trap 'exit 130' INT
            trap 'exit 143' TERM

            test -f "$pending_key" || { echo "Prepared SelfSteal private key is missing" >&2; exit 1; }
            test -f "$pending_cert" || { echo "Prepared SelfSteal certificate is missing" >&2; exit 1; }
            test -f "$previous_key" || { echo "SelfSteal private-key rollback file is missing" >&2; exit 1; }
            test -f "$previous_cert" || { echo "SelfSteal certificate rollback file is missing" >&2; exit 1; }
            mv -fT -- "$pending_key" "$live_key"
            mv -fT -- "$pending_cert" "$live_cert"
            live_certificate_key_fingerprint="$(openssl x509 -in "$live_cert" -pubkey -noout |
              openssl pkey -pubin -outform DER | sha256sum | cut -d' ' -f1)"
            live_private_key_fingerprint="$(openssl pkey -in "$live_key" -pubout -outform DER |
              sha256sum | cut -d' ' -f1)"
            if [[ "$live_certificate_key_fingerprint" != "$live_private_key_fingerprint" ]]; then
              echo "Deployed SelfSteal certificate and private key do not match" >&2
              exit 1
            fi
            rm -f -- "$previous_key" "$previous_cert"
            trap - EXIT INT TERM
          args:
            executable: /bin/bash
          changed_when: true
      always:
        - name: Start SelfSteal after certificate deployment
          ansible.builtin.command:
            argv:
              - docker
              - compose
              - --project-directory
              - '{{ selfsteal_dir }}'
              - up
              - -d
              - --remove-orphans
          changed_when: true

        - name: Remove the trusted certificate staging directory
          ansible.builtin.file:
            path: '{{ selfsteal_certificate_stage_dir }}'
            state: absent
          no_log: true

        - name: Wait for SelfSteal after certificate deployment
          ansible.builtin.shell: |
            stable_checks=0
            last_state='unknown'
            for attempt in $(seq 1 30); do
              last_state="$(docker inspect --format \
                '{% raw %}status={{.State.Status}} running={{.State.Running}} restarting={{.State.Restarting}} restarts={{.RestartCount}}{% endraw %}' \
                nginx-selfsteal 2>&1 || true)"
              if [[ "$last_state" == *'status=running running=true restarting=false'* ]]; then
                stable_checks=$((stable_checks + 1))
                if [ "$stable_checks" -ge 3 ]; then
                  docker exec nginx-selfsteal nginx -t
                  exit 0
                fi
              else
                stable_checks=0
              fi
              sleep 2
            done
            echo "SelfSteal did not recover after certificate deployment: $last_state" >&2
            docker logs --tail 100 nginx-selfsteal >&2 || true
            exit 1
          args:
            executable: /bin/bash
          changed_when: false

    - name: Protect the installed SelfSteal private key
      ansible.builtin.file:
        path: '{{ selfsteal_dir }}/ssl/private.key'
        owner: root
        group: root
        mode: '0600'

    - name: Remove the temporary SelfSteal TLS directory
      ansible.builtin.file:
        path: '{{ selfsteal_bootstrap_tls_dir }}'
        state: absent

    - name: Validate the certificate hostname
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - '{{ selfsteal_dir }}/ssl/fullchain.crt'
          - -noout
          - -checkhost
          - '{{ node_fqdn }}'
      changed_when: false

    - name: Validate the certificate lifetime
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - '{{ selfsteal_dir }}/ssl/fullchain.crt'
          - -noout
          - -checkend
          - '86400'
      changed_when: false

    - name: Read the certificate subject after installation
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - '{{ selfsteal_dir }}/ssl/fullchain.crt'
          - -noout
          - -subject
          - -nameopt
          - RFC2253
      register: installed_certificate_subject
      changed_when: false

    - name: Read the certificate issuer after installation
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -in
          - '{{ selfsteal_dir }}/ssl/fullchain.crt'
          - -noout
          - -issuer
          - -nameopt
          - RFC2253
      register: installed_certificate_issuer
      changed_when: false

    - name: Reject a SelfSteal self-signed fallback certificate
      ansible.builtin.assert:
        that:
          - >-
            (installed_certificate_subject.stdout | regex_replace('^subject=', '')) !=
            (installed_certificate_issuer.stdout | regex_replace('^issuer=', ''))
        fail_msg: >-
          SelfSteal fell back to a self-signed certificate. The job remains failed
          until Let's Encrypt issues a trusted certificate for {{ node_fqdn }}.

    - name: Read the certificate public-key fingerprint
      ansible.builtin.shell: >-
        set -o pipefail &&
        openssl x509 -in {{ selfsteal_dir | quote }}/ssl/fullchain.crt -pubkey -noout |
        openssl pkey -pubin -outform DER |
        sha256sum | cut -d' ' -f1
      args:
        executable: /bin/bash
      register: certificate_public_key
      changed_when: false

    - name: Read the private-key public-key fingerprint
      ansible.builtin.shell: >-
        set -o pipefail &&
        openssl pkey -in {{ selfsteal_dir | quote }}/ssl/private.key -pubout -outform DER |
        sha256sum | cut -d' ' -f1
      args:
        executable: /bin/bash
      register: private_key_public_key
      changed_when: false
      no_log: true

    - name: Verify that the certificate and private key match
      ansible.builtin.assert:
        that:
          - certificate_public_key.stdout | length == 64
          - certificate_public_key.stdout == private_key_public_key.stdout
        fail_msg: SelfSteal certificate and private key do not match.
      no_log: true

    - name: Validate automatic SelfSteal certificate renewal
      ansible.builtin.command:
        argv:
          - '{{ selfsteal_dir }}/acme-renew.sh'
          - --check
      changed_when: false

    - name: Inspect required containers
      ansible.builtin.command:
        argv:
          - docker
          - inspect
          - --format
          - '{% raw %}{{.Name}} {{.State.Status}} {{.RestartCount}}{% endraw %}'
          - '{{ item }}'
      loop:
        - remnanode
        - nginx-selfsteal
      register: required_containers
      changed_when: false

    - name: Require both containers to be running
      ansible.builtin.assert:
        that:
          - item.stdout is search(' running [0-9]+$')
        fail_msg: 'Container check failed: {{ item.stdout | default(item.stderr) }}'
      loop: '{{ required_containers.results }}'

    - name: Read final firewall status
      ansible.builtin.command:
        argv:
          - ufw
          - status
          - verbose
      register: final_ufw_status
      changed_when: false

    - name: Require an active firewall
      ansible.builtin.assert:
        that:
          - "'Status: active' in final_ufw_status.stdout"
        fail_msg: UFW is not active after provisioning.

    - name: Find recovered SelfSteal archives for this job
      ansible.builtin.find:
        paths: /opt
        patterns: nginx-selfsteal.partial-{{ provisioning_job_id }}-*
        file_type: directory
        recurse: false
      register: recovered_selfsteal_archives

    - name: Remove recovered SelfSteal archives after successful verification
      ansible.builtin.file:
        path: '{{ item.path }}'
        state: absent
      loop: '{{ recovered_selfsteal_archives.files }}'
      no_log: true

    - name: Clear the cabinet SelfSteal recovery marker
      ansible.builtin.file:
        path: '{{ selfsteal_marker_path }}'
        state: absent
