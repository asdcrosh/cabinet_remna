name: remnawave-cabinet

services:
  db:
    image: postgres:16-alpine
    container_name: remnawave-cabinet-db
    restart: unless-stopped
    env_file:
      - ${CABINET_ENV_FILE:-.env}
    environment:
      NODE_PROVISIONING_ENCRYPTION_KEY: ""
      TIMEWEB_API_TOKEN: ""
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${CABINET_DB_BIND:-127.0.0.1}:${CABINET_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cabinet

  check-env:
    image: ${CABINET_IMAGE:-ghcr.io/asdcrosh/cabinet_remna:latest}
    container_name: remnawave-cabinet-check-env
    command: ["node", "ops/check-env.mjs"]
    env_file:
      - ${CABINET_ENV_FILE:-.env}
    restart: "no"
    networks:
      - cabinet

  migrate:
    image: ${CABINET_IMAGE:-ghcr.io/asdcrosh/cabinet_remna:latest}
    container_name: remnawave-cabinet-migrate
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    env_file:
      - ${CABINET_ENV_FILE:-.env}
    environment:
      NODE_PROVISIONING_ENCRYPTION_KEY: ""
      TIMEWEB_API_TOKEN: ""
    depends_on:
      check-env:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
    networks:
      - cabinet
      - remnawave_external

  seed:
    image: ${CABINET_IMAGE:-ghcr.io/asdcrosh/cabinet_remna:latest}
    container_name: remnawave-cabinet-seed
    command: ["node", "ops/seed.js"]
    env_file:
      - ${CABINET_ENV_FILE:-.env}
    environment:
      NODE_PROVISIONING_ENCRYPTION_KEY: ""
      TIMEWEB_API_TOKEN: ""
    depends_on:
      migrate:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
    networks:
      - cabinet
      - remnawave_external

  app:
    image: ${CABINET_IMAGE:-ghcr.io/asdcrosh/cabinet_remna:latest}
    container_name: remnawave-cabinet-app
    restart: unless-stopped
    env_file:
      - ${CABINET_ENV_FILE:-.env}
    environment:
      APP_IMAGE_REFERENCE: ${CABINET_IMAGE:-ghcr.io/asdcrosh/cabinet_remna:latest}
      DEPLOY_STATE_FILE: /run/cabinet-state/deployment.json
      TIMEWEB_API_TOKEN: ""
    depends_on:
      seed:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "3000"
    ports:
      - "${CABINET_APP_BIND:-127.0.0.1}:${CABINET_APP_PORT:-3000}:3000"
    volumes:
      - "${FULL_BACKUP_DIR:-/opt/remnawave-backups}:/backups:ro"
      - "${CABINET_STATE_DIR:-/opt/remnawave-cabinet/state}:/run/cabinet-state:ro"
      - broadcast_uploads:/app/public/uploads
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- --header=\"x-healthcheck-token: $$HEALTHCHECK_TOKEN\" http://127.0.0.1:3000/api/health >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      cabinet:
      remnawave_external:
        aliases:
          - remnawave-cabinet-app

  worker:
    image: ${CABINET_IMAGE:-ghcr.io/asdcrosh/cabinet_remna:latest}
    container_name: remnawave-cabinet-worker
    command: ["node", "ops/payment-reconciler.js"]
    restart: unless-stopped
    env_file:
      - ${CABINET_ENV_FILE:-.env}
    environment:
      NODE_PROVISIONING_ENCRYPTION_KEY: ""
      TIMEWEB_API_TOKEN: ""
    depends_on:
      seed:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const fs=require('fs');const p='/tmp/payment-reconciler-heartbeat';const max=(Number(process.env.PAYMENT_WORKER_HEARTBEAT_MAX_AGE_SECONDS||180)*1000);try{process.exit(Date.now()-fs.statSync(p).mtimeMs<max?0:1)}catch{process.exit(1)}\"",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - cabinet
      - remnawave_external

  broadcast-worker:
    image: ${CABINET_IMAGE:-ghcr.io/asdcrosh/cabinet_remna:latest}
    container_name: remnawave-cabinet-broadcast-worker
    command: ["node", "ops/broadcast-worker.js"]
    restart: unless-stopped
    env_file:
      - ${CABINET_ENV_FILE:-.env}
    environment:
      NODE_PROVISIONING_ENCRYPTION_KEY: ""
      TIMEWEB_API_TOKEN: ""
    depends_on:
      seed:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const fs=require('fs');const p='/tmp/broadcast-worker-heartbeat';const raw=Number(process.env.BROADCAST_WORKER_INTERVAL_SECONDS);const interval=Number.isInteger(raw)&&raw>0?raw:10;try{process.exit(Date.now()-fs.statSync(p).mtimeMs<Math.max(90,interval*4)*1000?0:1)}catch{process.exit(1)}\"",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - cabinet
      - remnawave_external

  watch-worker:
    image: ${CABINET_IMAGE:-ghcr.io/asdcrosh/cabinet_remna:latest}
    container_name: remnawave-cabinet-watch-worker
    command: ["node", "ops/watch-worker.js"]
    restart: unless-stopped
    env_file:
      - ${CABINET_ENV_FILE:-.env}
    environment:
      NODE_PROVISIONING_ENCRYPTION_KEY: ""
      TIMEWEB_API_TOKEN: ""
    depends_on:
      seed:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const fs=require('fs');const p='/tmp/watch-worker-heartbeat';const max=(Number(process.env.WATCH_INTERVAL_SECONDS||60)*3*1000);try{process.exit(Date.now()-fs.statSync(p).mtimeMs<max?0:1)}catch{process.exit(1)}\"",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - cabinet
      - remnawave_external

  node-provisioning-worker:
    image: ${CABINET_PROVISIONER_IMAGE:-ghcr.io/asdcrosh/cabinet_remna-provisioner:latest}
    container_name: remnawave-cabinet-node-provisioning-worker
    command: ["node", "ops/node-provisioning-worker.js"]
    restart: unless-stopped
    profiles:
      - provisioning
    environment:
      NODE_ENV: production
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL}
      TIMEWEB_API_TOKEN: ${TIMEWEB_API_TOKEN:-}
      REMNAWAVE_BASE_URL: ${REMNAWAVE_BASE_URL}
      REMNAWAVE_TOKEN: ${REMNAWAVE_TOKEN}
      NODE_PROVISIONING_BASE_DOMAIN: ${NODE_PROVISIONING_BASE_DOMAIN:-}
      NODE_PROVISIONING_ENCRYPTION_KEY: ${NODE_PROVISIONING_ENCRYPTION_KEY:-}
      NODE_PROVISIONING_COUNTRY_CODE: ${NODE_PROVISIONING_COUNTRY_CODE:-XX}
      NODE_PROVISIONING_PANEL_IP: ${NODE_PROVISIONING_PANEL_IP:-}
      NODE_PROVISIONING_ADMIN_EMAIL: ${NODE_PROVISIONING_ADMIN_EMAIL:-}
      NODE_PROVISIONING_REMNANODE_IMAGE: ${NODE_PROVISIONING_REMNANODE_IMAGE:-}
      NODE_PROVISIONING_WORKER_INTERVAL_SECONDS: ${NODE_PROVISIONING_WORKER_INTERVAL_SECONDS:-5}
      NODE_PROVISIONING_WORKER_HEARTBEAT_MAX_AGE_SECONDS: ${NODE_PROVISIONING_WORKER_HEARTBEAT_MAX_AGE_SECONDS:-180}
      NODE_PROVISIONING_DNS_TIMEOUT_SECONDS: ${NODE_PROVISIONING_DNS_TIMEOUT_SECONDS:-300}
      NODE_PROVISIONING_CONNECT_TIMEOUT_SECONDS: ${NODE_PROVISIONING_CONNECT_TIMEOUT_SECONDS:-300}
      NODE_PROVISIONING_ANSIBLE_PLAYBOOK: ${NODE_PROVISIONING_ANSIBLE_PLAYBOOK:-/app/deploy/provisioner/provision-remnanode.yml}
      NODE_PROVISIONING_ANSIBLE_TIMEOUT_SECONDS: ${NODE_PROVISIONING_ANSIBLE_TIMEOUT_SECONDS:-1800}
    depends_on:
      seed:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const fs=require('fs');const p='/tmp/node-provisioning-worker-heartbeat';const max=(Number(process.env.NODE_PROVISIONING_WORKER_HEARTBEAT_MAX_AGE_SECONDS||180)*1000);try{process.exit(Date.now()-fs.statSync(p).mtimeMs<max?0:1)}catch{process.exit(1)}\"",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - cabinet
      - remnawave_external

  retention-cleanup:
    image: ${CABINET_IMAGE:-ghcr.io/asdcrosh/cabinet_remna:latest}
    container_name: remnawave-cabinet-retention-cleanup
    command:
      [
        "sh",
        "-c",
        "while true; do node ops/cleanup-retention.js; sleep $${RETENTION_CLEANUP_INTERVAL_SECONDS:-86400}; done",
      ]
    restart: unless-stopped
    profiles:
      - maintenance
    env_file:
      - ${CABINET_ENV_FILE:-.env}
    environment:
      NODE_PROVISIONING_ENCRYPTION_KEY: ""
      TIMEWEB_API_TOKEN: ""
    depends_on:
      seed:
        condition: service_completed_successfully
    networks:
      - cabinet

  caddy:
    image: caddy:2-alpine
    container_name: remnawave-cabinet-caddy
    restart: unless-stopped
    profiles:
      - caddy
    env_file:
      - ${CABINET_ENV_FILE:-.env}
    environment:
      NODE_PROVISIONING_ENCRYPTION_KEY: ""
      TIMEWEB_API_TOKEN: ""
    command:
      - caddy
      - reverse-proxy
      - --from
      - ${APP_URL}
      - --to
      - app:3000
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - cabinet

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  broadcast_uploads:

networks:
  cabinet:
  remnawave_external:
    name: ${CABINET_EXTERNAL_NETWORK:-remnawave-network}
    external: true
